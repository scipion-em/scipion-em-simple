[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scipion-em-simple"
version = "1.0.3"
description = "Plugin to use Simple programs within the Scipion framework"
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "GPL-3.0-or-later"}
authors = [
  {name = "I2PC", email = "scipion@cnb.csic.es"}
]
keywords = ["scipion", "electron-microscopy", "cryo-em", "structural-biology", "image-processing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 2.7"
]

[project.urls]
Homepage = "https://github.com/scipion-em/scipion-em-simple"
"Bug Reports" = "https://github.com/scipion-em/scipion-em-simple/issues"
Source = "https://github.com/scipion-em/scipion-em-simple/"

[tool.setuptools.packages.find]
include = ["simple*"]

[tool.setuptools.package-data]
simple = ["simple_logo.png", "protocols.conf"]
